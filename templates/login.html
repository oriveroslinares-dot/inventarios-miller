{% extends "base.html" %}
{% block title %}Acceso funcionarios · TRIPLE AAA{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card card-institucional p-4 mt-4">
            <h4 class="mb-3 text-center"><i class="bi bi-person-badge"></i> Acceso funcionarios</h4>
            {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
            <form method="post" action="/admin/login">
                <div class="mb-3">
                    <label class="form-label">Correo institucional</label>
                    <input type="email" name="correo" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Ingresar</button>
            </form>
            <div class="text-muted small mt-3 text-center">
                Panel exclusivo para ADMINISTRADOR, FUNCIONARIO, SUPERVISOR y CONSULTA.
            </div>
        </div>
    </div>
</div>
{% endblock %}
