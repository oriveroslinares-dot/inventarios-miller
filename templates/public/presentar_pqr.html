{% extends "base.html" %}
{% block title %}Presentar PQR · TRIPLE AAA{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card card-institucional p-4">
            <h4 class="mb-3"><i class="bi bi-chat-left-text text-primary"></i> Presentar una PQR</h4>
            <form method="post" action="/presentar-pqr" enctype="multipart/form-data">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Tipo de PQR</label>
                        <select name="tipo_pqr" class="form-select" required>
                            {% for t in tipos_pqr %}<option value="{{ t }}">{{ t }}</option>{% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Servicio relacionado</label>
                        <select name="servicio_id" class="form-select">
                            <option value="">No especifica</option>
                            {% for s in servicios %}<option value="{{ s.id }}">{{ s.nombre }}</option>{% endfor %}
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Asunto</label>
                        <input name="asunto" class="form-control" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Descripción</label>
                        <textarea name="descripcion" class="form-control" rows="4" required></textarea>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Dirección (opcional)</label>
                        <input name="direccion" class="form-control">
                    </div>
                    <div class="col-12">
                        <label class="form-label">Evidencia / documento (opcional)</label>
                        <input type="file" name="evidencia_archivo" class="form-control" accept="image/*,application/pdf,.doc,.docx">
                    </div>
                    <hr class="my-2">
                    <h6>Datos de contacto</h6>
                    <div class="col-md-4">
                        <label class="form-label">Tipo doc.</label>
                        <select name="tipo_documento" class="form-select">
                            <option>CC</option><option>NIT</option><option>CE</option><option>TI</option><option>PA</option>
                        </select>
                    </div>
                    <div class="col-md-8">
                        <label class="form-label">Número de documento</label>
                        <input name="numero_documento" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Nombre completo</label>
                        <input name="nombre_completo" class="form-control">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Teléfono</label>
                        <input name="telefono" class="form-control">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Correo</label>
                        <input name="correo" type="email" class="form-control">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 mt-4">Radicar PQR</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
